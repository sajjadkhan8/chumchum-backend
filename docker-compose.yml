services:
  postgres:
    image: postgres:16-alpine
    container_name: chumchum-postgres
    environment:
      POSTGRES_DB: zingzing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zingzing"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chumchum-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/zingzing?currentSchema=core
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_BASE64: ZGV2LXNlY3JldC1yZXBsYWNlLXRoaXMtd2l0aC1hdC1sZWFzdC0zMi1ieXRlcy1mb3ItcHJvZA==
      UPLOAD_DIR: /app/uploads
      UPLOAD_BASE_URL: http://localhost:8080/uploads
    ports:
      - "8080:8080"
    volumes:
      - app_uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  app_uploads:

