spring:
  application:
    name: zingzing-backend
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:500MB}
      max-request-size: ${MAX_REQUEST_SIZE:502MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zingzing?currentSchema=core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Haripur@1}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: core
  flyway:
    enabled: true
    create-schemas: true
    default-schema: core
    schemas: core
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:programming.coach.urdu@gmail.com}
    password: ${SMTP_PASSWORD:doiz tjmn hccw snos}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: false

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    deep-linking: true
  swagger-ui.csrf:
    enabled: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.security: INFO
    com.zingzing.backend: INFO

security:
  jwt:
    secret: ${JWT_SECRET_BASE64:VPzKhqS5IzEMmEIp/u7F6wVZLXIxWZPbNWc/rPHlWiJONK8dqD2uMg4Ab9WpY1yo8SIiuusjgMa36qtuUQAwPw==}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh:
    expiration-seconds: ${REFRESH_EXPIRATION_SECONDS:2592000}
    admin-expiration-seconds: ${ADMIN_REFRESH_EXPIRATION_SECONDS:86400}
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Strict}
    max-age-seconds: ${COOKIE_MAX_AGE:2592000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4200,http://localhost:5173,http://localhost:4173,https://chumchum-frontend.vercel.app}
  oauth:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:44085381746-geq9li8fbig81d0lb4jjatpp72earjgk.apps.googleusercontent.com}
      token-info-url: ${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  environment: ${SENTRY_ENVIRONMENT:development}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

app:
  name: ${APP_NAME:ZingZing}
  storage:
    driver: ${STORAGE_DRIVER:local}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  email:
    log-content: ${EMAIL_LOG_CONTENT:false}
    from-address: ${SMTP_FROM_ADDRESS:noreply@zingzing.pk}
    from-name: ZingZing
  refunds:
    mock:
      webhook-secret: ${MOCK_REFUND_WEBHOOK_SECRET:dev-mock-refund-webhook-secret}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}

platform:
  fee-rate: ${PLATFORM_FEE_RATE:0.10}

# ─── Safepay Express Checkout ────────────────────────────────────────────────
# Required for live payments:
#   SAFEPAY_API_KEY     - Merchant API key (Dashboard → Developers → API Keys → API Key)
#   SAFEPAY_SECRET_KEY  - Secret key (Dashboard → Developers → API Keys → Secret Key)
#   SAFEPAY_HMAC_KEY    - Webhook HMAC key (Dashboard → Developers → Endpoints → HMAC Key)
##
# To switch to production:
#   SAFEPAY_ENVIRONMENT=production
#   Set the above three env vars to your LIVE dashboard values (different from sandbox).
##
# To disable online payments (e.g. during maintenance):
#   SAFEPAY_ENABLED=false
safepay:
  enabled: ${SAFEPAY_ENABLED:true}
  environment: ${SAFEPAY_ENVIRONMENT:sandbox}
  api-key: ${SAFEPAY_API_KEY:sec_66d2a8c6-8bfe-482d-ad8e-9698c16381ca}
  secret-key: ${SAFEPAY_SECRET_KEY:7a86e128d6beb3bf32fde35aae82b3b0112a168d90d6478b7e2b3d440743ecdc}
  hmac-key: ${SAFEPAY_HMAC_KEY:8aece5a35b38c03d0adb49e609ee9818c92d2d473410087393abb583828210e9}
  intent: ${SAFEPAY_INTENT:CYBERSOURCE}
  entry-mode: ${SAFEPAY_ENTRY_MODE:flex}
  sandbox-base-url: ${SAFEPAY_SANDBOX_BASE_URL:https://sandbox.api.getsafepay.com}
  production-base-url: ${SAFEPAY_PRODUCTION_BASE_URL:https://api.getsafepay.com}
  webhook-tolerance-seconds: ${SAFEPAY_WEBHOOK_TOLERANCE_SECONDS:300}
